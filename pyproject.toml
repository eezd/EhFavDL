[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ehfavdl"
version = "1.3.8"
description = "Download E-Hentai and ExHentai favorites"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "aiohttp==3.9.5",
    "beautifulsoup4==4.12.3",
    "chardet==5.2.0",
    "loguru==0.7.2",
    "Pillow==11.0.0",
    "PyYAML==6.0.2",
    "tqdm==4.66.6",
]

[project.optional-dependencies]
dev = [
    "build>=1.2,<2",
    "pytest>=8,<10",
    "ruff>=0.8,<1",
]

[project.scripts]
ehfavdl = "main:cli"

[tool.setuptools]
py-modules = ["main"]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
